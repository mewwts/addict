[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "addict"
version = "3.0.0"
description = "Addict is a dictionary whose items can be set using both attribute and item syntax."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mats Julian Olsen", email = "mats@plysjbyen.net" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/mewwts/addict"
Repository = "https://github.com/mewwts/addict"

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
